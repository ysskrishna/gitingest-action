name: Release workflow tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Checkout release action under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ysskrishna/changelog-release-action
          ref: c574fb829fd42a3979bd1c9920650ad9da4634fe
          path: .release-action
          persist-credentials: false
      - name: Install release test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/release-tests"
          "$RUNNER_TEMP/release-tests/bin/python" -m pip install -r .release-action/requirements-dev.txt
          echo "$RUNNER_TEMP/release-tests/bin" >> "$GITHUB_PATH"
      - name: Verify this changelog through the composite action without publishing
        run: python3 .release-action/tests/pilot.py "$GITHUB_WORKSPACE"
