name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-local-repo:
    name: Analyze local repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitingest on current repo
        id: digest
        uses: ./
        with:
          output-dir: 'gitingest-output'

      - name: Verify output files exist and are non-empty
        run: |
          for file in summary.txt tree.txt content.txt; do
            filepath="gitingest-output/$file"
            if [ ! -f "$filepath" ]; then
              echo "::error::$filepath does not exist"
              exit 1
            fi
            if [ ! -s "$filepath" ]; then
              echo "::error::$filepath is empty"
              exit 1
            fi
            echo "$file exists ($(wc -c < "$filepath") bytes)"
          done

      - name: Verify action outputs point to real files
        env:
          SUMMARY_FILE: ${{ steps.digest.outputs.summary-file }}
          TREE_FILE: ${{ steps.digest.outputs.tree-file }}
          CONTENT_FILE: ${{ steps.digest.outputs.content-file }}
        run: |
          for name in SUMMARY_FILE TREE_FILE CONTENT_FILE; do
            path="${!name}"
            if [ -z "$path" ]; then
              echo "::error::Output $name is empty"
              exit 1
            fi
            if [ ! -f "$path" ]; then
              echo "::error::Output $name points to '$path' which does not exist"
              exit 1
            fi
            echo "$name = $path (exists)"
          done

  test-remote-repo:
    name: Analyze remote repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitingest on remote repo
        uses: ./
        with:
          source: 'https://github.com/ysskrishna/social-links'
          output-dir: 'remote-output'

      - name: Verify summary mentions repository name
        run: |
          if ! grep -qi "social-links" remote-output/summary.txt; then
            echo "::error::summary.txt does not mention 'social-links'"
            exit 1
          fi
          echo "Summary correctly references the repository"

      - name: Verify output files exist
        run: |
          for file in summary.txt tree.txt content.txt; do
            filepath="remote-output/$file"
            if [ ! -f "$filepath" ]; then
              echo "::error::$filepath does not exist"
              exit 1
            fi
            echo "$file exists ($(wc -c < "$filepath") bytes)"
          done

  test-include-patterns:
    name: Analyze with include patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitingest with pattern filters
        uses: ./
        with:
          include-patterns: |
            *.yml
            *.md
          output-dir: 'filtered-output'

      - name: Verify output files exist
        run: |
          for file in summary.txt tree.txt content.txt; do
            filepath="filtered-output/$file"
            if [ ! -f "$filepath" ]; then
              echo "::error::$filepath does not exist"
              exit 1
            fi
            echo "$file exists ($(wc -c < "$filepath") bytes)"
          done

  test-invalid-source:
    name: Fail gracefully on invalid source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitingest with non-existent repo
        id: digest
        uses: ./
        continue-on-error: true
        with:
          source: 'https://github.com/this-user-does-not-exist-xyz/this-repo-does-not-exist-abc'

      - name: Verify action failed
        env:
          OUTCOME: ${{ steps.digest.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected failure, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "Action correctly failed for invalid source"
